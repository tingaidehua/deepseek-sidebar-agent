<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DS Agent 设置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #1f2937; background: #f8fafc; padding: 32px; max-width: 560px; }
  h1 { font-size: 18px; margin-bottom: 6px; }
  .sub { color: #6b7280; font-size: 12px; margin-bottom: 24px; }
  .row { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  .row .txt { flex: 1; }
  .row .t { font-weight: 600; }
  .row .d { font-size: 12px; color: #6b7280; margin-top: 3px; line-height: 1.6; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #4f46e5; }
  input[type=number] { width: 64px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  #save { margin-top: 8px; padding: 10px 28px; border: none; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  #save:hover { background: #4338ca; }
  #tip { margin-left: 12px; font-size: 12px; color: #059669; }
</style>
</head>
<body>
  <h1>⚡ DS Agent 设置</h1>
  <div class="sub">修改即时生效，无需重启浏览器。侧边栏只负责展示生成的程序，所有开关都在这里。</div>

  <div class="row">
    <div class="txt"><div class="t">Agent 模式默认开启</div><div class="d">在 DeepSeek 输入框发送时，按意图（游戏/代码/闲聊）自动增强提示词。页面右下角的 🤖 开关可临时切换。</div></div>
    <input type="checkbox" id="agentMode" checked>
  </div>
  <div class="row">
    <div class="txt"><div class="t">深度思考默认开启</div><div class="d">智能体任务的推理质量生命线。代价是生成稍慢、token 消耗更多。</div></div>
    <input type="checkbox" id="deepThink" checked>
  </div>
  <div class="row">
    <div class="txt"><div class="t">联网搜索默认开启</div><div class="d">建议关闭：游戏/代码生成不需要搜索，搜索会引入脏数据并增加延迟。调研类任务可在需要时手动打开。</div></div>
    <input type="checkbox" id="webSearch">
  </div>
  <div class="row">
    <div class="txt"><div class="t">报错自动修复轮次</div><div class="d">游戏运行时报错后，自动让模型修复的最大轮数（0 = 不自动修复）。</div></div>
    <input type="number" id="fixRounds" min="0" max="5" value="3">
  </div>

  <button id="save">保存</button><span id="tip"></span>

<script>
(async () => {
  const d = await chrome.storage.local.get("dsa:settings");
  const s = d["dsa:settings"] || {};
  document.getElementById("agentMode").checked = s.agentMode !== false;
  document.getElementById("deepThink").checked = s.deepThink !== false;
  document.getElementById("webSearch").checked = !!s.webSearch;
  document.getElementById("fixRounds").value = s.fixRounds ?? 3;
  document.getElementById("save").addEventListener("click", async () => {
    await chrome.storage.local.set({ "dsa:settings": {
      agentMode: document.getElementById("agentMode").checked,
      deepThink: document.getElementById("deepThink").checked,
      webSearch: document.getElementById("webSearch").checked,
      fixRounds: Math.max(0, Math.min(5, Number(document.getElementById("fixRounds").value) || 0)),
    }});
    const tip = document.getElementById("tip");
    tip.textContent = "✓ 已保存";
    setTimeout(() => tip.textContent = "", 2000);
  });
})();
</script>
</body>
</html>
