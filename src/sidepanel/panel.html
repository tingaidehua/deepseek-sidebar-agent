<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header id="bar">
  <div class="brand">⚡ <span>DS Agent</span></div>
  <div id="status" class="status">就绪</div>
  <select id="history" class="hist" title="历史版本" hidden></select>
  <button id="btnOptions" class="icon-btn" title="设置">⚙️</button>
</header>

<main id="stage">
  <div id="empty" class="empty">
    <div class="empty-art">🎮</div>
    <div class="empty-title">在 DeepSeek 输入框说一句话</div>
    <div class="empty-sub">比如「帮我开发一个俄罗斯方块」<br>游戏会自动在这里生成并运行</div>
  </div>
  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <div id="loadingText">正在生成…</div>
  </div>
  <iframe id="gameFrame" sandbox="allow-scripts" hidden title="游戏"></iframe>
  <div id="errbar" class="errbar" hidden></div>
</main>

<div id="toolbar" class="toolbar" hidden>
  <button id="btnRegen" title="换个玩法重新生成">🔁</button>
  <button id="btnOpen" title="在新标签页打开">⤢</button>
  <button id="btnDl" title="下载 HTML">⬇</button>
  <button id="btnClose" title="关闭">✕</button>
</div>

<script src="panel.js"></script>
</body>
</html>
